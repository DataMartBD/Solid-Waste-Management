    UserAdmin:
      type: object
      description: |-
        Creating and editing operators, from the Users page.

        Separate from `UserSerializer` on purpose. That one is the *session* shape —
        the signed-in user reading themselves, with phone, role and scope read-only
        because nobody may promote themselves. This one is an administrator acting
        on somebody else, so those are exactly the fields it must be able to write.

        What it still refuses is in `validate`: an admin may not edit their own role,
        scope or active flag. Not because it is dangerous in itself, but because the
        account doing it is the one that would have to undo it — a city with one
        agency admin who demotes themselves has nobody left who can put it back.
      properties:
        id:
          type: integer
          readOnly: true
        phone:
          type: string
        name:
          type: string
          maxLength: 120
        role:
          $ref: '#/components/schemas/RoleEnum'
        roleLabel:
          type: string
          readOnly: true
        scopeKind:
          $ref: '#/components/schemas/ScopeKindEnum'
        scopeZone:
          type: string
          maxLength: 8
        scopeWards:
          type: array
          items:
            type: string
        scope:
          type: string
          readOnly: true
        agency:
          type: string
          nullable: true
        collector:
          type: string
          nullable: true
        city:
          type: string
          description: Short code, e.g. 'KCC'
          nullable: true
        email:
          type: string
          format: email
          maxLength: 254
        altPhone:
          type: string
        nid:
          type: string
          title: National ID
          maxLength: 30
        bloodGroup:
          type: string
        emergencyContact:
          type: string
        isActive:
          type: boolean
        hasPin:
          type: boolean
          readOnly: true
        lastLogin:
          type: string
          format: date-time
          readOnly: true
      required:
      - hasPin
      - id
      - lastLogin
      - name
      - phone
      - role
      - roleLabel
      - scope
