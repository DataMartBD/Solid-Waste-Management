    PositionIngest:
      type: object
      description: |-
        A telemetry ping, or a batch of them.

        Trackers behave two ways and both post here: a connected device sends one
        ping at a time, while a device coming back from a dead spot flushes a queue.
        `for_payload()` picks single or `many=True` from the shape of the body so the
        gateway does not need two endpoints.
      properties:
        van:
          type: string
        collector:
          type: string
          nullable: true
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        speed:
          type: number
          format: double
          nullable: true
        heading:
          type: integer
          maximum: 359
          minimum: 0
          nullable: true
        accuracy:
          type: integer
          minimum: 0
          nullable: true
        ignition:
          type: boolean
          default: true
        at:
          type: string
          format: date-time
          nullable: true
      required:
      - lat
      - lng
      - van
