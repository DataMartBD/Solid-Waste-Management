      enum:
      - ''
    ChannelEnum:
      enum:
      - sms
      - app
      - phone
      - counter
      type: string
      description: |-
        * `sms` - SMS
        * `app` - App
        * `phone` - Phone call
        * `counter` - Service counter
    Collector:
      type: object
      description: A field collector, as the Collectors table and the round header
        read it.
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 120
        dspId:
          type: string
        zone:
          type: string
        phone:
          type: string
          maxLength: 20
        onTime:
          type: integer
          maximum: 100
          minimum: 0
        coverage:
          type: integer
          maximum: 100
          minimum: 0
        complaints:
          type: integer
          description: Prefers the viewset's annotation; falls back for one-off serialising.
          readOnly: true
        status:
          $ref: '#/components/schemas/CollectorStatusEnum'
        license:
          type: string
          maxLength: 32
        licenseExp:
          type: string
          format: date
          nullable: true
        joined:
          type: string
          format: date
          nullable: true
        attendance:
          $ref: '#/components/schemas/AttendanceEnum'
        active:
          type: boolean
        vanId:
          type: string
          nullable: true
          description: The van this collector drives. Fleet owns the link, so it is
            read-only.
          readOnly: true
        assignmentId:
          type: string
          nullable: true
          readOnly: true
      required:
      - assignmentId
      - complaints
      - id
      - name
      - vanId
      - zone
    CollectorRequest:
      type: object
      description: A field collector, as the Collectors table and the round header
        read it.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        dspId:
          type: string
          minLength: 1
        zone:
          type: string
          minLength: 1
        phone:
          type: string
          maxLength: 20
        onTime:
          type: integer
          maximum: 100
          minimum: 0
        coverage:
          type: integer
          maximum: 100
          minimum: 0
        status:
