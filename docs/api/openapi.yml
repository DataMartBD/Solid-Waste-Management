components:
  schemas:
    ActionEnum:
      enum:
      - created
      - assigned
      - in_progress
      - resolved
      - closed
      - reassigned
      - priority
      - note
      - reopened
      type: string
      description: |-
        * `created` - Created
        * `assigned` - Assigned
        * `in_progress` - Work started
        * `resolved` - Resolved
        * `closed` - Closed
        * `reassigned` - Reassigned
        * `priority` - Priority changed
        * `note` - Note added
        * `reopened` - Reopened
    Agency:
      type: object
      description: ModelSerializer with server-assigned ids and blank-friendly text.
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 160
        nameBn:
          type: string
          maxLength: 160
        shortCode:
          type: string
        agencyType:
          type: string
          nullable: true
        tradeLicenceNo:
          type: string
        registrationNo:
          type: string
        tin:
          type: string
          maxLength: 20
        bin:
          type: string
          maxLength: 20
        contactPerson:
          type: string
        phone:
          type: string
          maxLength: 20
        altPhone:
          type: string
        email:
          type: string
          format: email
          maxLength: 254
        address:
          type: string
          maxLength: 200
        contractNo:
          type: string
        contractStart:
          type: string
          format: date
          nullable: true
        contractEnd:
          type: string
          format: date
          nullable: true
        city:
          type: string
          description: Short code, e.g. 'KCC'
          nullable: true
        serviceWards:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/AgencyStatusEnum'
        active:
          type: boolean
        notes:
          type: string
        contractExpired:
          type: boolean
          readOnly: true
        collectorCount:
          type: integer
          readOnly: true
        holdingCount:
          type: integer
          readOnly: true
      required:
      - collectorCount
      - contractExpired
      - holdingCount
      - id
      - name
      - shortCode
    AgencyRequest:
      type: object
      description: ModelSerializer with server-assigned ids and blank-friendly text.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        nameBn:
          type: string
          maxLength: 160
        shortCode:
          type: string
          minLength: 1
        agencyType:
          type: string
          minLength: 1
          nullable: true
        tradeLicenceNo:
          type: string
        registrationNo:
          type: string
        tin:
          type: string
          maxLength: 20
        bin:
          type: string
          maxLength: 20
        contactPerson:
          type: string
        phone:
          type: string
          maxLength: 20
        altPhone:
          type: string
        email:
          type: string
          format: email
          maxLength: 254
        address:
          type: string
          maxLength: 200
        contractNo:
          type: string
        contractStart:
          type: string
          format: date
          nullable: true
        contractEnd:
          type: string
          format: date
          nullable: true
        city:
          type: string
          minLength: 1
          description: Short code, e.g. 'KCC'
          nullable: true
        serviceWards:
          type: array
          items:
            type: string
            minLength: 1
        status:
          $ref: '#/components/schemas/AgencyStatusEnum'
        active:
          type: boolean
        notes:
          type: string
      required:
      - name
      - shortCode
    AgencyStatusEnum:
      enum:
      - active
      - suspended
      - expired
      - terminated
      type: string
      description: |-
        * `active` - Active
        * `suspended` - Suspended
        * `expired` - Contract expired
        * `terminated` - Terminated
    AgencyType:
      type: object
      properties:
        id:
          type: string
          maxLength: 48
        key:
          type: string
          maxLength: 96
        label:
          type: string
          maxLength: 96
        sort_order:
          type: integer
          maximum: 32767
          minimum: 0
        active:
          type: boolean
      required:
      - id
      - key
      - label
    AgencyTypeRequest:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 48
        key:
          type: string
          minLength: 1
          maxLength: 96
        label:
          type: string
          minLength: 1
          maxLength: 96
        sort_order:
          type: integer
          maximum: 32767
          minimum: 0
        active:
          type: boolean
      required:
      - id
      - key
      - label
    Answer:
      type: object
      properties:
        question:
          type: string
          readOnly: true
        questionNumber:
          type: string
          readOnly: true
        questionText:
          type: string
          readOnly: true
        questionTextBn:
          type: string
          readOnly: true
        option:
          type: string
          readOnly: true
        label:
          type: string
          readOnly: true
        labelBn:
          type: string
          readOnly: true
        text:
          type: string
        number:
          type: string
          readOnly: true
        date:
          type: string
          format: date
          nullable: true
      required:
      - label
      - labelBn
      - number
      - option
      - question
      - questionNumber
      - questionText
      - questionTextBn
    Ask:
      type: object
      properties:
        question:
          type: string
          maxLength: 500
      required:
      - question
    AskRequest:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - question
    Assignment:
      type: object
      description: Which routes a collector is responsible for.
      properties:
        id:
          type: string
          readOnly: true
        collector:
          type: string
        routes:
          type: array
          items:
            type: string
            maxLength: 32
        active:
          type: boolean
      required:
      - collector
      - id
    AssignmentRequest:
      type: object
      description: Which routes a collector is responsible for.
      properties:
        collector:
          type: string
          minLength: 1
        routes:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 32
        active:
          type: boolean
      required:
      - collector
    AttendanceEnum:
      enum:
      - checked_in
      - absent
      type: string
      description: |-
        * `checked_in` - Checked in
        * `absent` - Absent
    Bill:
      type: object
      description: A holding's charge for one month, plus what has been received on
        it.
      properties:
        id:
          type: string
          readOnly: true
        holding:
          type: string
        holdingNo:
          type: string
          readOnly: true
        head:
          type: string
          readOnly: true
        period:
          type: string
          description: YYYY-MM being charged for
          maxLength: 7
        issuedAt:
          type: string
          format: date
        dueOn:
          type: string
          format: date
          readOnly: true
        amount:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: BDT
        ward:
          type: string
        status:
          type: string
          readOnly: true
        method:
          type: string
          readOnly: true
        run:
          type: integer
          readOnly: true
        received:
          type: integer
