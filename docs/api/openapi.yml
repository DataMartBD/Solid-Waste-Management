  /api/bills/:
    get:
      operationId: api_bills_list
      description: Monthly charges. Read widely, written only by a billing run or
        a payment.
      parameters:
      - in: query
        name: hasOutstanding
        schema:
          type: boolean
      - in: query
        name: holding
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: period
        schema:
          type: string
      - in: query
        name: run
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: settlement
        schema:
          type: string
          enum:
          - overdue
          - paid
          - partial
          - unpaid
        description: |-
          * `unpaid` - Unpaid
          * `partial` - Partially paid
          * `paid` - Paid
          * `overdue` - Overdue
      - in: query
        name: status
        schema:
          type: string
          enum:
          - overdue
          - paid
          - partial
          - unpaid
        description: |-
          * `unpaid` - Unpaid
          * `partial` - Partially paid
          * `paid` - Paid
          * `overdue` - Overdue
      - in: query
        name: ward
        schema:
          type: string
      - in: query
        name: zone
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBillList'
          description: ''
    post:
      operationId: api_bills_create
      description: |-
        Bills come from a billing run, never from an ad-hoc insert.

        A hand-made bill would have no `run`, so the month's `BillingRun` totals
        would no longer describe the month, and a holding could quietly end up
        charged twice for reasons no audit trail explains. Superusers are let
        through as a maintenance escape hatch (fixing seed data, backfilling a
        month the run missed) — they are the one caller who can be assumed to
        know they are stepping outside the process.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BillRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BillRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'
          description: ''
