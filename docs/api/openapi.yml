components:
  schemas:
    ActionEnum:
      enum:
      - created
      - assigned
      - in_progress
      - resolved
      - closed
      - reassigned
      - priority
      - note
      - reopened
      type: string
      description: |-
        * `created` - Created
        * `assigned` - Assigned
        * `in_progress` - Work started
        * `resolved` - Resolved
        * `closed` - Closed
        * `reassigned` - Reassigned
        * `priority` - Priority changed
        * `note` - Note added
        * `reopened` - Reopened
    Ask:
      type: object
      properties:
        question:
          type: string
          maxLength: 500
      required:
      - question
    AskRequest:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - question
    Assignment:
      type: object
      description: Which routes a collector is responsible for.
      properties:
        id:
          type: string
          readOnly: true
        collector:
          type: string
        routes:
          type: array
          items:
            type: string
            maxLength: 32
        active:
          type: boolean
      required:
      - collector
      - id
    AssignmentRequest:
      type: object
      description: Which routes a collector is responsible for.
      properties:
        collector:
          type: string
          minLength: 1
        routes:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 32
        active:
          type: boolean
      required:
      - collector
    AttendanceEnum:
      enum:
      - checked_in
      - absent
      type: string
      description: |-
        * `checked_in` - Checked in
        * `absent` - Absent
    Bill:
      type: object
      description: A household's charge for one month, plus what has been received
        on it.
      properties:
        id:
          type: string
          readOnly: true
        hh:
          type: string
        head:
          type: string
          readOnly: true
        period:
          type: string
          description: YYYY-MM being charged for
          maxLength: 7
        issuedAt:
          type: string
          format: date
        dueOn:
          type: string
          format: date
          readOnly: true
        amount:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: BDT
        ward:
          type: string
        status:
          type: string
          readOnly: true
        method:
          type: string
          readOnly: true
        run:
          type: integer
          readOnly: true
        received:
          type: integer
          readOnly: true
        outstanding:
          type: integer
          readOnly: true
        settlement:
          type: string
          description: The truth, derived from payments — `status` is only its cache.
          readOnly: true
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
          readOnly: true
      required:
      - amount
      - dueOn
      - head
      - hh
      - id
      - issuedAt
      - method
      - outstanding
      - payments
      - period
      - received
      - run
      - settlement
      - status
      - ward
    BillRequest:
      type: object
      description: A household's charge for one month, plus what has been received
        on it.
      properties:
        hh:
          type: string
          minLength: 1
        period:
          type: string
          minLength: 1
          description: YYYY-MM being charged for
          maxLength: 7
        issuedAt:
          type: string
          format: date
        amount:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: BDT
        ward:
          type: string
          minLength: 1
      required:
      - amount
      - hh
      - issuedAt
      - period
      - ward
    BillingRun:
      type: object
      description: One month's generation, kept so a run is auditable and repeatable.
      properties:
        id:
          type: integer
          readOnly: true
        period:
          type: string
          readOnly: true
          description: YYYY-MM
        issuedOn:
          type: string
          format: date
          readOnly: true
        billCount:
          type: integer
          readOnly: true
        totalAmount:
          type: integer
          readOnly: true
        generatedBy:
          type: string
          nullable: true
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
