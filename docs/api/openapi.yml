          maxLength: 20
        altPhone:
          type: string
          maxLength: 20
        profession:
          type: string
          maxLength: 80
        email:
          type: string
          format: email
        contactPerson:
          type: string
          maxLength: 120
        bloodGroup:
          type: string
          maxLength: 4
        unit:
          type: string
          maxLength: 24
        holdingType:
          type: string
          minLength: 1
        floor:
          type: string
          maxLength: 32
        address:
          type: string
          maxLength: 200
        members:
          type: integer
          maximum: 99
          minimum: 0
        membersUnder5:
          type: integer
          maximum: 99
          minimum: 0
        membersFemale:
          type: integer
