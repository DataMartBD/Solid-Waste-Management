    NestedHousehold:
      type: object
      description: |-
        One family, as the Holding editor writes it.

        A building and the families inside it are entered on one visit, so they are
        entered on one screen: the editor shows the holding on the left and its
        households on the right, and this is the right-hand side of that payload.
        Every field the standalone Households form has is accepted here, so the two
        screens agree on what a household is.

        `id` is what distinguishes an edit from an addition. Present, it updates
        that household — and it must already belong to this holding, or the editor
        could be used to reassign somebody else's family into this building. Absent,
        it creates one. A household is never deleted from here: complaints may name
        it, so retiring one is a `status` change, which is a field on this form like
        any other.

        There is no charge or payment here: the service charge is the holding's.

        The address is *not* here. Ward, road and holding number belong to the
        building and are copied down on save; accepting them per family would let a
        caller write a value the next save silently overwrites.
      properties:
        id:
          type: string
        head:
          type: string
          maxLength: 120
        customerType:
          type: string
        phone:
          type: string
          maxLength: 20
        altPhone:
          type: string
          maxLength: 20
        profession:
          type: string
          maxLength: 80
        email:
          type: string
          format: email
        contactPerson:
          type: string
          maxLength: 120
        bloodGroup:
          type: string
          maxLength: 4
        unit:
          type: string
          maxLength: 24
        holdingType:
          type: string
        floor:
          type: string
          maxLength: 32
        address:
          type: string
          maxLength: 200
        members:
          type: integer
          maximum: 99
          minimum: 0
        membersUnder5:
          type: integer
          maximum: 99
          minimum: 0
        membersFemale:
          type: integer
          maximum: 99
          minimum: 0
        storage:
          type: string
        suitableTime:
          type: string
        status:
          $ref: '#/components/schemas/StatusA3eEnum'
      required:
      - head
    NestedHouseholdRequest:
      type: object
      description: |-
