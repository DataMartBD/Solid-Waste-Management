      operationId: api_auth_pin_create
      description: Set, change or remove the signed-in user's PIN.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinSetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PinSetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PinSetRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    put:
      operationId: api_auth_pin_update
      description: Set, change or remove the signed-in user's PIN.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PinChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PinChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    delete:
      operationId: api_auth_pin_destroy
      description: Set, change or remove the signed-in user's PIN.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/pin/login/:
    post:
      operationId: api_auth_pin_login_create
      description: Sign in with phone + PIN.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PinLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PinLoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/pin/status/:
    get:
      operationId: api_auth_pin_status_retrieve
      description: Does this phone have a PIN, and is it currently locked out?
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
