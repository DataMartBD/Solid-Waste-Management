openapi: 3.0.3
info:
  title: Smart Sweep SWMS API
  version: 1.0.0
  description: Solid waste management backend for Khulna City Corporation.
paths:
  /api/ai/ask/:
    post:
      operationId: api_ai_ask_create
      description: '`POST /api/ai/ask` — answer an operational question from live
        data.'
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AskRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AskRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ask'
          description: ''
  /api/ai/facts/:
    get:
      operationId: api_ai_facts_retrieve
      description: |-
        `GET /api/ai/facts` — the snapshot the assistant reasons over.

        Exposed so the UI can show the same numbers the assistant quotes, and so the
        assistant's answers are auditable.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/assignments/:
    get:
      operationId: api_assignments_list
      description: The default CRUD endpoint shape for this project.
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
      - in: query
        name: collector
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: ward
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssignmentList'
          description: ''
    post:
      operationId: api_assignments_create
      description: The default CRUD endpoint shape for this project.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
          description: ''
  /api/assignments/{id}/:
    get:
      operationId: api_assignments_retrieve
      description: The default CRUD endpoint shape for this project.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this assignment.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
          description: ''
    put:
      operationId: api_assignments_update
      description: The default CRUD endpoint shape for this project.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this assignment.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
          description: ''
    patch:
      operationId: api_assignments_partial_update
      description: The default CRUD endpoint shape for this project.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this assignment.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAssignmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAssignmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAssignmentRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
          description: ''
    delete:
      operationId: api_assignments_destroy
      description: The default CRUD endpoint shape for this project.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this assignment.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/assignments/{id}/routes/:
    post:
      operationId: api_assignments_routes_create
      description: |-
        Set the routes this assignment covers.

        A route already held by somebody else is taken over — the planner allows
        reassigning it, and `set_routes` drops the conflicting link.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this assignment.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
          description: ''
  /api/auth/demo-operators/:
    get:
      operationId: api_auth_demo_operators_retrieve
      description: |-
        The account list the login screen offers as demo shortcuts.

        Only served while DEBUG is on — it would be an account-enumeration endpoint
        in production.
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/logout/:
    post:
      operationId: api_auth_logout_create
      description: Revoke a refresh token.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/me/:
    get:
      operationId: api_auth_me_retrieve
      description: Read or edit the signed-in operator's own profile.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: api_auth_me_update
      description: Read or edit the signed-in operator's own profile.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileUpdate'
          description: ''
    patch:
      operationId: api_auth_me_partial_update
      description: Read or edit the signed-in operator's own profile.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileUpdate'
          description: ''
  /api/auth/otp/request/:
    post:
      operationId: api_auth_otp_request_create
      description: Issue a login code for a phone number.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/otp/verify/:
    post:
      operationId: api_auth_otp_verify_create
      description: Exchange a valid code for a JWT pair.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/pin/:
    post:
      operationId: api_auth_pin_create
      description: Set, change or remove the signed-in user's PIN.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinSetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PinSetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PinSetRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    put:
      operationId: api_auth_pin_update
      description: Set, change or remove the signed-in user's PIN.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PinChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PinChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    delete:
      operationId: api_auth_pin_destroy
      description: Set, change or remove the signed-in user's PIN.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/pin/login/:
    post:
      operationId: api_auth_pin_login_create
      description: Sign in with phone + PIN.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PinLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PinLoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/pin/status/:
    get:
      operationId: api_auth_pin_status_retrieve
      description: Does this phone have a PIN, and is it currently locked out?
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/refresh/:
    post:
      operationId: api_auth_refresh_create
      description: |-
        Rotate a refresh token.

        SimpleJWT handles rotation and blacklisting; this subclass only normalises
        the failure body to the app's `{detail, code, fields}` envelope so the
        frontend's interceptor has one shape to branch on.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/billing-runs/:
    get:
      operationId: api_billing_runs_list
      description: The audit list of billing runs. Written by `POST /bills/generate/`.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: period
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBillingRunList'
          description: ''
    post:
      operationId: api_billing_runs_create
      description: The audit list of billing runs. Written by `POST /bills/generate/`.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingRun'
          description: ''
  /api/billing-runs/{id}/:
    get:
      operationId: api_billing_runs_retrieve
      description: The audit list of billing runs. Written by `POST /bills/generate/`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this billing run.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingRun'
          description: ''
    put:
      operationId: api_billing_runs_update
      description: The audit list of billing runs. Written by `POST /bills/generate/`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this billing run.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingRun'
          description: ''
    patch:
      operationId: api_billing_runs_partial_update
      description: The audit list of billing runs. Written by `POST /bills/generate/`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this billing run.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingRun'
          description: ''
    delete:
      operationId: api_billing_runs_destroy
      description: The audit list of billing runs. Written by `POST /bills/generate/`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this billing run.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/bills/:
    get:
      operationId: api_bills_list
      description: Monthly charges. Read widely, written only by a billing run or
        a payment.
      parameters:
      - in: query
        name: hasOutstanding
        schema:
          type: boolean
      - in: query
        name: hh
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: period
        schema:
          type: string
      - in: query
        name: run
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: settlement
        schema:
          type: string
          enum:
          - overdue
          - paid
          - partial
          - unpaid
        description: |-
          * `unpaid` - Unpaid
          * `partial` - Partially paid
          * `paid` - Paid
          * `overdue` - Overdue
      - in: query
        name: status
        schema:
          type: string
          enum:
          - overdue
          - paid
          - partial
          - unpaid
        description: |-
          * `unpaid` - Unpaid
          * `partial` - Partially paid
          * `paid` - Paid
          * `overdue` - Overdue
      - in: query
        name: ward
        schema:
          type: string
      - in: query
        name: zone
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBillList'
          description: ''
    post:
      operationId: api_bills_create
      description: |-
        Bills come from a billing run, never from an ad-hoc insert.

        A hand-made bill would have no `run`, so the month's `BillingRun` totals
        would no longer describe the month, and a household could quietly end up
        charged twice for reasons no audit trail explains. Superusers are let
        through as a maintenance escape hatch (fixing seed data, backfilling a
        month the run missed) — they are the one caller who can be assumed to
        know they are stepping outside the process.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BillRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BillRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'
          description: ''
  /api/bills/{id}/:
    get:
      operationId: api_bills_retrieve
      description: Monthly charges. Read widely, written only by a billing run or
        a payment.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this bill.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'
          description: ''
    put:
      operationId: api_bills_update
      description: Monthly charges. Read widely, written only by a billing run or
        a payment.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this bill.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BillRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BillRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'
          description: ''
    patch:
      operationId: api_bills_partial_update
      description: Monthly charges. Read widely, written only by a billing run or
        a payment.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this bill.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBillRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBillRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBillRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'
          description: ''
    delete:
      operationId: api_bills_destroy
      description: Monthly charges. Read widely, written only by a billing run or
        a payment.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this bill.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/bills/{id}/pay/:
    post:
      operationId: api_bills_pay_create
      description: Record money against this bill — the only way its status can change.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this bill.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BillRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BillRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'
          description: ''
  /api/bills/generate/:
    post:
      operationId: api_bills_generate_create
      description: Run — or with `dryRun`, preview — one month's charges.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BillRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BillRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'
          description: ''
  /api/bills/summary/:
    get:
      operationId: api_bills_summary_retrieve
      description: |-
        The Billing page's stat cards, for one period.

