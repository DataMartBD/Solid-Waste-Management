openapi: 3.0.3
info:
  title: Smart Sweep SWMS API
  version: 1.0.0
  description: Solid waste management backend for Khulna City Corporation.
paths:
  /api/agencies/:
    get:
      operationId: api_agencies_list
      description: The agencies under contract to the city corporation.
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
      - in: query
        name: agencyType
        schema:
          type: string
      - in: query
        name: city
        schema:
          type: string
        description: Short code, e.g. 'KCC'
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - expired
          - suspended
          - terminated
        description: |-
          * `active` - Active
          * `suspended` - Suspended
          * `expired` - Contract expired
          * `terminated` - Terminated
      - in: query
        name: ward
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAgencyList'
          description: ''
    post:
      operationId: api_agencies_create
      description: The agencies under contract to the city corporation.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgencyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgencyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgencyRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agency'
          description: ''
  /api/agencies/{id}/:
    get:
      operationId: api_agencies_retrieve
      description: The agencies under contract to the city corporation.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this agency.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agency'
          description: ''
    put:
      operationId: api_agencies_update
      description: The agencies under contract to the city corporation.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this agency.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgencyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgencyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgencyRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agency'
          description: ''
    patch:
      operationId: api_agencies_partial_update
      description: The agencies under contract to the city corporation.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this agency.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAgencyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAgencyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAgencyRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agency'
          description: ''
    delete:
      operationId: api_agencies_destroy
      description: The agencies under contract to the city corporation.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this agency.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/agencies/{id}/collectors/:
    get:
      operationId: api_agencies_collectors_retrieve
      description: Who this agency currently employs.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this agency.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agency'
          description: ''
  /api/agencies/{id}/employment-history/:
    get:
      operationId: api_agencies_employment_history_retrieve
      description: Every collector this agency has employed, and when.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this agency.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agency'
          description: ''
  /api/agency-types/:
    get:
      operationId: api_agency_types_list
      description: 'Setup list: kinds of agency (private company, NGO, in-house…).'
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAgencyTypeList'
          description: ''
    post:
      operationId: api_agency_types_create
      description: 'Setup list: kinds of agency (private company, NGO, in-house…).'
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgencyTypeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgencyTypeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgencyTypeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgencyType'
          description: ''
  /api/agency-types/{id}/:
    get:
      operationId: api_agency_types_retrieve
      description: 'Setup list: kinds of agency (private company, NGO, in-house…).'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this agency type.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgencyType'
          description: ''
    put:
      operationId: api_agency_types_update
      description: 'Setup list: kinds of agency (private company, NGO, in-house…).'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this agency type.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgencyTypeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgencyTypeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgencyTypeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgencyType'
          description: ''
    patch:
      operationId: api_agency_types_partial_update
      description: 'Setup list: kinds of agency (private company, NGO, in-house…).'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this agency type.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAgencyTypeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAgencyTypeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAgencyTypeRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgencyType'
          description: ''
    delete:
      operationId: api_agency_types_destroy
      description: 'Setup list: kinds of agency (private company, NGO, in-house…).'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this agency type.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/ai/ask/:
    post:
      operationId: api_ai_ask_create
      description: '`POST /api/ai/ask` — answer an operational question from live
        data.'
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AskRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AskRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ask'
          description: ''
  /api/ai/facts/:
    get:
      operationId: api_ai_facts_retrieve
      description: |-
        `GET /api/ai/facts` — the snapshot the assistant reasons over.

        Exposed so the UI can show the same numbers the assistant quotes, and so the
        assistant's answers are auditable.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/assignments/:
    get:
      operationId: api_assignments_list
      description: The default CRUD endpoint shape for this project.
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
      - in: query
        name: collector
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: ward
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssignmentList'
          description: ''
    post:
      operationId: api_assignments_create
      description: The default CRUD endpoint shape for this project.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
          description: ''
  /api/assignments/{id}/:
    get:
      operationId: api_assignments_retrieve
      description: The default CRUD endpoint shape for this project.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this assignment.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
          description: ''
    put:
      operationId: api_assignments_update
      description: The default CRUD endpoint shape for this project.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this assignment.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
          description: ''
    patch:
      operationId: api_assignments_partial_update
      description: The default CRUD endpoint shape for this project.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this assignment.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAssignmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAssignmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAssignmentRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
          description: ''
    delete:
      operationId: api_assignments_destroy
      description: The default CRUD endpoint shape for this project.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this assignment.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/assignments/{id}/routes/:
    post:
      operationId: api_assignments_routes_create
      description: |-
        Set the routes this assignment covers.

        A route already held by somebody else is taken over — the planner allows
        reassigning it, and `set_routes` drops the conflicting link.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this assignment.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
          description: ''
  /api/auth/demo-operators/:
    get:
      operationId: api_auth_demo_operators_retrieve
      description: |-
        The account list the login screen offers as demo shortcuts.

        Only served while DEBUG is on — it would be an account-enumeration endpoint
        in production.
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/login/:
    post:
      operationId: api_auth_login_create
      description: |-
        Sign in with phone + password.

        This is the only path the login screen offers. The OTP and PIN endpoints
        below still work and are left in place, but nothing in the UI calls them.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/logout/:
    post:
      operationId: api_auth_logout_create
      description: Revoke a refresh token.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/me/:
    get:
      operationId: api_auth_me_retrieve
      description: Read or edit the signed-in operator's own profile.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: api_auth_me_update
      description: Read or edit the signed-in operator's own profile.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
          multipart/form-data:
            schema:
